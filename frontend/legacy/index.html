<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个性化诊断测试</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="card center-card">
  <h1>个性化诊断测试</h1>
  <p class="muted">请输入你的学号，系统将显示为你定制的诊断问卷</p>
  <form id="login-form">
    <label for="student-id">学号</label>
    <input id="student-id" inputmode="numeric" autocomplete="off"
           placeholder="例如 20260003" autofocus>
    <button type="submit" class="primary">开 始</button>
    <p id="error" class="error" hidden></p>
  </form>
</main>
<script>
const form = document.getElementById('login-form');
const input = document.getElementById('student-id');
const error = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  error.hidden = true;
  const sid = input.value.trim();
  if (!sid) { showError('请输入学号'); return; }
  try {
    const res = await fetch('/api/exam/' + encodeURIComponent(sid));
    if (res.ok) {
      location.href = '/exam?student_id=' + encodeURIComponent(sid);
      return;
    }
    const data = await res.json().catch(() => ({}));
    showError(data.detail || ('请求失败 (' + res.status + ')'));
  } catch (err) {
    showError('网络错误，请稍后重试');
  }
});

function showError(msg) { error.textContent = msg; error.hidden = false; }
</script>
</body>
</html>
