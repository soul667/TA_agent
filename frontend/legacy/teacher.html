<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师 / 助教面板</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="card wide-card">
  <h1>教师 / 助教面板</h1>
  <h2>总览</h2>
  <div class="table-wrap">
    <table id="overview-table">
      <thead>
        <tr>
          <th>Student</th>
          <th>Original issue</th>
          <th>Exam</th>
          <th>Result</th>
          <th>AI score</th>
          <th>TA review</th>
        </tr>
      </thead>
      <tbody id="overview-body">
        <tr><td colspan="6">加载中……</td></tr>
      </tbody>
    </table>
  </div>

  <div id="detail" hidden>
    <h2 id="detail-title"></h2>
    <div class="actions">
      <button id="reevaluate-btn" class="primary">重新评价</button>
      <button id="regenerate-btn">重新生成问卷</button>
      <span id="detail-msg" class="muted small"></span>
    </div>
    <div id="detail-content"></div>
  </div>
</main>
<script>
const ISSUE_ZH = {
  'initialization': '初始化错误', 'edge-case': '边界情况', 'out-of-bounds': '数组越界',
  'wrong-comparison': '比较方向错误', 'incomplete-traversal': '遍历不完整',
  'missing-return': '缺少返回值', 'index-range': '下标范围', 'loop-boundary': '循环边界',
  'undefined-behavior': '未定义行为', 'loop-invariant': '循环不变量',
  'traversal-necessity': '遍历必要性', 'traversal-role': '遍历作用',
  'return-mechanism': '返回机制', 'precondition': '前置条件', 'complexity': '复杂度',
  'algorithm-necessity': '算法必要性', 'understanding-check': '理解确认',
  'unknown': '未知/通用',
};
const STATUS_ZH = { not_generated: '未生成', waiting: 'waiting', done: 'done' };

let currentSid = null;

loadOverview();

async function loadOverview() {
  const tbody = document.getElementById('overview-body');
  try {
    const res = await fetch('/api/teacher/overview');
    const data = await res.json();
    tbody.innerHTML = '';
    if (!data.rows.length) {
      tbody.innerHTML = '<tr><td colspan="6">没有学生数据</td></tr>';
      return;
    }
    data.rows.forEach(row => {
      const tr = document.createElement('tr');
      tr.className = 'clickable';
      tr.addEventListener('click', () => loadDetail(row.student_id));
      const issues = row.original_issues.length
        ? row.original_issues.map(t => ISSUE_ZH[t] || t).join('、')
        : '—';
      const cells = [
        row.student_id,
        issues,
        STATUS_ZH[row.exam_status] || row.exam_status,
        row.understanding_zh || '-',
        row.score === null ? '-' : row.score + ' / ' + row.max_score,
        row.needs_ta_review ? '⚠️ 需要' : '—',
      ];
      cells.forEach(c => {
        const td = document.createElement('td');
        td.textContent = c;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="6">加载失败</td></tr>';
  }
}

async function loadDetail(sid) {
  currentSid = sid;
  const box = document.getElementById('detail');
  const content = document.getElementById('detail-content');
  document.getElementById('detail-msg').textContent = '';
  box.hidden = false;
  content.innerHTML = '<p class="muted">加载中……</p>';
  document.getElementById('detail-title').textContent = '学生 ' + sid + ' 详情';
  try {
    const res = await fetch('/api/teacher/students/' + sid);
    const data = await res.json();
    if (!res.ok) { content.innerHTML = '<p class="error">' + (data.detail || '加载失败') + '</p>'; return; }
    content.innerHTML = '';
    content.appendChild(section('原始提交', codeBlock(data.submission.code)));

    const diag = data.questionnaire.diagnosis;
    let diagHtml = '<p>' + escapeHtml(diag.summary) + '</p>';
    if (diag.issues.length) {
      diagHtml += '<ul>' + diag.issues.map(i =>
        '<li><b>[' + (ISSUE_ZH[i.type] || i.type) + ' / ' + i.severity + ']</b> ' +
        escapeHtml(i.description) +
        (i.evidence ? '<br><code class="muted">' + escapeHtml(i.evidence) + '</code>' : '') +
        '</li>').join('') + '</ul>';
    }
    content.appendChild(section('AI 诊断（仅教师可见）', div(diagHtml)));

    const qa = data.questionnaire.questions.map((q, i) => {
      const answer = data.response ? data.response.answers[q.id] : null;
      let answerStr;
      if (answer === null || answer === undefined) answerStr = '<i class="muted">未提交</i>';
      else if (Array.isArray(answer)) answerStr = escapeHtml(answer.join(','));
      else answerStr = escapeHtml(String(answer));
      let qHtml = '<p><b>Q' + (i + 1) + ' [' + q.type + ']（目标: ' +
        (ISSUE_ZH[q.target_issue] || q.target_issue) + '）</b><br>' +
        escapeHtml(q.question) + '</p>';
      if (q.choices) {
        qHtml += '<ol class="choices">' + q.choices.map((c, j) =>
          '<li value="' + (j + 1) + '">' + escapeHtml(c) + '</li>').join('') + '</ol>';
      }
      qHtml += '<p>参考答案: <code>' + escapeHtml(q.expected_answer) +
        '</code> ｜ 学生回答: <code>' + answerStr + '</code></p>';
      return div(qHtml, 'qa-item');
    });
    qa.forEach(el => content.appendChild(el));

    if (data.evaluation) {
      const ev = data.evaluation;
      const evHtml = '<p><b>' + (ev.understanding_zh_map || '') + '</b>' +
        '<b>理解程度:</b> ' + ev.understanding + ' ｜ <b>分数:</b> ' + ev.score + '/' + ev.max_score +
        ' ｜ <b>置信度:</b> ' + ev.confidence +
        ' ｜ <b>需要 TA 复核:</b> ' + (ev.needs_ta_review ? '是' : '否') +
        ' ｜ <b>基于第 ' + ev.based_on_attempt + ' 次提交</b></p>' +
        '<p>' + escapeHtml(ev.feedback) + '</p>' +
        (ev.remaining_issues.length
          ? '<p><b>遗留问题:</b></p><ul>' + ev.remaining_issues.map(r => '<li>' + escapeHtml(r) + '</li>').join('') + '</ul>'
          : '');
      content.appendChild(section('AI 评价', div(evHtml)));
    } else {
      content.appendChild(section('AI 评价', div('<i class="muted">暂无（学生未提交或评价失败，可点击"重新评价"）</i>')));
    }
  } catch (e) {
    content.innerHTML = '<p class="error">网络错误</p>';
  }
}

document.getElementById('reevaluate-btn').addEventListener('click', async () => {
  if (!currentSid) return;
  await postAction('/api/teacher/students/' + currentSid + '/evaluate', '评价中……');
});
document.getElementById('regenerate-btn').addEventListener('click', async () => {
  if (!currentSid || !confirm('重新生成会覆盖该学生的问卷，确定？')) return;
  await postAction('/api/teacher/students/' + currentSid + '/regenerate', '生成中……');
});

async function postAction(url, doing) {
  const msg = document.getElementById('detail-msg');
  msg.textContent = doing;
  try {
    const res = await fetch(url, { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    msg.textContent = res.ok ? '完成 ✓' : ('失败: ' + (data.detail || res.status));
    if (res.ok) { loadOverview(); loadDetail(currentSid); }
  } catch (e) { msg.textContent = '网络错误'; }
}

function section(title, node) {
  const s = document.createElement('section');
  s.className = 'section';
  const h = document.createElement('h3');
  h.textContent = title;
  s.appendChild(h);
  s.appendChild(node);
  return s;
}
function div(html, className) {
  const d = document.createElement('div');
  if (className) d.className = className;
  d.innerHTML = html;
  return d;
}
function codeBlock(text) {
  const pre = document.createElement('pre');
  pre.className = 'code';
  pre.textContent = text;
  return pre;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
