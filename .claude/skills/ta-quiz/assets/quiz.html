<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抽查题</title>
<style>
/*__FONTS__*/
/*__SHARED_CSS__*/
/* 布局：首页是全班名单；点开一位学生，桌面上并排两栏——左边抽查卷，右边学生代码。
   一个强调色（钢笔蓝）负责交互，红笔只用于答案，黄色只用于代码里被问到的行。 */
:root {
  --bg: #eceff4; --card: #ffffff; --ink: #17202b; --ink-2: #5a6878; --line: #dce2ea;
  --accent: #2448a3; --accent-wash: #e8eefb; --red: #c62828; --red-wash: #fdeeee;
  --amber: #8a5300; --amber-wash: #fff3d9; --ok: #17803d;
  --shadow: 0 1px 2px rgb(23 32 43 / .05), 0 8px 28px rgb(23 32 43 / .07);
  --bar-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --card: #151b23; --ink: #e6edf3; --ink-2: #9aa7b6; --line: #28313c;
    --accent: #8fb0ff; --accent-wash: #1b2740; --red: #ff8f86; --red-wash: #3b2022;
    --amber: #f0c36d; --amber-wash: #33290f; --ok: #6ee79a;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 28px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --card: #151b23; --ink: #e6edf3; --ink-2: #9aa7b6; --line: #28313c;
  --accent: #8fb0ff; --accent-wash: #1b2740; --red: #ff8f86; --red-wash: #3b2022;
  --amber: #f0c36d; --amber-wash: #33290f; --ok: #6ee79a;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 28px rgb(0 0 0 / .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + 16px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
code { font: 500 .88em var(--mono); background: var(--accent-wash); color: var(--ink); padding: 1px 6px; border-radius: 5px; }

/* —— 顶栏 —— */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1360px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex: 1 1 200px; color: inherit; text-decoration: none; }
.brand b { font-size: 18px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.brand span { color: var(--ink-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.find { position: relative; flex: 1 1 240px; max-width: 360px; }
.find input { width: 100%; padding: 8px 40px 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-variant-numeric: tabular-nums; }
.find input::placeholder { color: var(--ink-2); }
.find input:focus { outline: none; border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 3px var(--accent-wash); }
.find kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 12px var(--mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; pointer-events: none; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.pager { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.pager button { border: 0; background: none; padding: 5px 11px; font-size: 16px; line-height: 1.2; color: var(--ink-2); }
.pager button:hover:not(:disabled) { background: var(--accent-wash); color: var(--accent); }
.pager button:disabled { opacity: .35; cursor: default; }
.pager span { font: 500 13px var(--mono); color: var(--ink-2); padding: 0 6px; font-variant-numeric: tabular-nums; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track { width: 36px; height: 21px; border-radius: 11px; background: var(--line); position: relative; transition: background .2s; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--card); transition: transform .2s; box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
.switch input:checked + .track { background: var(--red); }
.switch input:checked + .track::after { transform: translateX(15px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input:disabled ~ * { opacity: .45; cursor: default; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 13px; font-size: 14px; color: var(--ink); text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); color: var(--accent); }

/* —— 名单 —— */
.roster { max-width: 1360px; margin: 0 auto; padding: 36px 20px 72px; }
.roster-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 40px; }
.eyebrow { margin-bottom: 6px; font-size: 12px; font-weight: 500; letter-spacing: .12em; color: var(--ink-2); }
h1 { font-size: clamp(24px, 3vw, 32px); line-height: 1.3; font-weight: 700; text-wrap: balance; }
.tally { display: flex; flex-wrap: wrap; margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.tally div { padding: 9px 20px 10px; border-left: 1px solid var(--line); }
.tally div:first-child { border-left: 0; }
.tally dt { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tally dd { margin: 2px 0 0; font: 600 22px/1.15 var(--mono); font-variant-numeric: tabular-nums; }
.progress { display: flex; height: 6px; margin: 22px 0 14px; border-radius: 999px; overflow: hidden; background: var(--line); }
.progress i { display: block; height: 100%; }
.progress .p-ready { background: var(--accent); } .progress .p-stale { background: #d69e2e; } .progress .p-empty { background: #94a3b8; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 13px; font-size: 13.5px; }
.chip b { font: 500 12px var(--mono); color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
.chip[aria-pressed="true"] b { color: inherit; opacity: .8; }
.class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 184px), 1fr)); gap: 10px; }
.stu { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; min-height: 66px; padding: 11px 14px; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
.stu:hover { border-color: var(--accent); box-shadow: 0 2px 10px rgb(36 72 163 / .12); }
.stu .sid { font: 500 15px var(--mono); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.stu .nm { grid-row: 2; color: var(--ink-2); font-size: 13px; min-height: 1.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stu .st { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.todo { background: none; box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.dot.empty { background: #94a3b8; border-radius: 2px; }
.dot.stale { background: #d69e2e; }
.stu[data-status="empty"] .sid { color: var(--ink-2); }
.none { color: var(--ink-2); padding: 32px 0; }

/* —— 答卷与代码 —— */
.desk { max-width: 1360px; margin: 0 auto; padding: 22px 20px 72px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1060px) {
  .desk.two { grid-template-columns: minmax(0, 1.04fr) minmax(0, 1fr); align-items: start; }
  .desk.two .code-col { position: sticky; top: calc(var(--bar-h) + 18px); max-height: calc(100vh - var(--bar-h) - 36px); overflow: auto; padding-right: 2px; }
  .desk.two .cb-body { --cb-max: none; }
}
.paper { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: clamp(22px, 4vw, 44px); min-width: 0; }
.paper-head { padding-bottom: 20px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
.paper-head h1 { font-size: clamp(22px, 2.4vw, 27px); }
.fields { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 30px; margin-top: 18px; font-size: 14px; }
.field { display: inline-flex; align-items: center; gap: 10px; }
.field > span:first-child { color: var(--ink-2); font-size: 13px; }
.boxes { display: inline-flex; }
.boxes i { width: 1.65em; height: 2em; display: grid; place-items: center; font: 500 15px/1 var(--mono); font-style: normal; border: 1px solid var(--ink-2); margin-left: -1px; }
.boxes i:first-child { margin-left: 0; border-radius: 6px 0 0 6px; } .boxes i:last-child { border-radius: 0 6px 6px 0; }
.name-line { min-width: 6em; padding: 0 8px 2px; border-bottom: 1.5px solid var(--ink); font-weight: 700; font-size: 16px; }
.name-sub { color: var(--ink-2); font-size: 12.5px; }
.score-box { width: 4.4em; height: 2.1em; border: 1px solid var(--ink-2); border-radius: 6px; }

.notice { margin: 0 0 22px; padding: 14px 16px; border-radius: 10px; background: var(--amber-wash); color: var(--amber); font-size: 14px; }
.notice b { display: block; font-size: 15px; margin-bottom: 2px; }
.notice.calm { background: var(--accent-wash); color: var(--ink); }
.say { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 4px 4px 4px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; font: 14px var(--mono); }
.say button { border: 0; background: var(--accent); color: var(--card); border-radius: 6px; padding: 3px 12px; font: 500 13px var(--sans); }

.key { display: none; }
body.show-key .key { display: block; }
body.show-key span.key { display: inline; }
.ta-note, .answer { color: var(--red); font-size: 15px; line-height: 1.75; }
.ta-note { margin: 0 0 26px; padding: 12px 16px; background: var(--red-wash); border-radius: 10px; }
.ta-note::before, .answer::before { content: attr(data-label); display: inline-block; margin-right: 10px; padding: 0 7px; border: 1.5px solid currentColor; border-radius: 4px; font: 700 11px/1.7 var(--sans); letter-spacing: .1em; vertical-align: 1px; }
.ta-note code, .answer code { background: var(--card); }

ol.qs { list-style: none; margin: 0; padding: 0; display: grid; gap: 34px; }
.q { display: grid; grid-template-columns: 2.4em minmax(0, 1fr); gap: 0 4px; border-radius: 10px; transition: background-color .6s; }
.q.flash { background: var(--accent-wash); box-shadow: 0 0 0 8px var(--accent-wash); }
.qn { width: 1.9em; height: 1.9em; display: grid; place-items: center; border-radius: 8px; background: var(--ink); color: var(--card); font: 700 14px/1 var(--mono); margin-top: 2px; }
.qbody { min-width: 0; container-type: inline-size; }
.stem { font-size: 16.5px; line-height: 1.85; }
.kind { display: inline-block; margin-right: 8px; padding: 0 8px; border-radius: 5px; background: var(--accent-wash); color: var(--accent); font-size: 12.5px; font-weight: 700; letter-spacing: .04em; vertical-align: 1px; }
.slot { white-space: nowrap; margin-left: 4px; }
.slot .fill { display: inline-block; min-width: 2.6em; text-align: center; }
body.show-key .slot .fill { color: var(--red); font-weight: 700; }
ol.opts { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px 22px; grid-template-columns: minmax(0, 1fr); }
ol.opts.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
ol.opts.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@container (max-width: 30em) { ol.opts.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container (max-width: 22em) { ol.opts.cols-4, ol.opts.cols-2 { grid-template-columns: minmax(0, 1fr); } }
.opts li { display: grid; grid-template-columns: 2em minmax(0, 1fr); align-items: baseline; padding: 3px 6px; border-radius: 8px; }
.letter { justify-self: start; width: 1.55em; height: 1.55em; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 50%; font: 600 12.5px/1 var(--mono); color: var(--ink-2); transform: translateY(.18em); }
body.show-key .opts li.correct { background: var(--red-wash); }
body.show-key .opts li.correct .letter { border-color: var(--red); background: var(--red); color: var(--card); }
.write { height: 5.6em; margin-top: 8px; background: repeating-linear-gradient(to bottom, transparent 0 calc(1.85em - 1px), var(--line) calc(1.85em - 1px) 1.85em); }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.ref { border: 1px solid var(--line); background: none; color: var(--ink-2); border-radius: 6px; padding: 0 9px; font: 500 12px/1.9 var(--mono); }
.ref:hover { border-color: var(--accent); background: var(--accent-wash); color: var(--accent); }
.answer { margin-top: 12px; }

.code-col { display: grid; gap: 14px; align-content: start; min-width: 0; }
.code-head h2 { font-size: 16px; font-weight: 700; }
.code-head p { margin-top: 3px; color: var(--ink-2); font-size: 13px; }
.notes { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.notes summary { cursor: pointer; width: max-content; }
.notes summary:hover { color: var(--accent); }
.code-head ul { margin: 8px 0 0; padding-left: 1.2em; color: var(--ink-2); font-size: 13px; }
@media (max-width: 1059px) { .code-col .cb-body { --cb-max: 70vh; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
@media print {
  @page { margin: 16mm; }
  body { background: #fff; color: #000; }
  .bar, .notice { display: none !important; }
  .desk { display: block; padding: 0; max-width: none; }
  .paper { box-shadow: none; padding: 0; }
  .desk.two .code-col { position: static; max-height: none; overflow: visible; break-before: page; padding-top: 12px; }
  .q { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <a class="brand" href="#" id="home"><b>抽查题</b><span id="bar-title"></span></a>
    <form class="find" id="find" role="search" autocomplete="off">
      <input id="q" type="search" placeholder="学号或姓名，回车打开" aria-label="学号或姓名" inputmode="search">
      <kbd>/</kbd>
    </form>
    <div class="tools" id="tools" hidden>
      <div class="pager">
        <button type="button" id="prev" aria-label="上一位">‹</button>
        <span id="pos"></span>
        <button type="button" id="next" aria-label="下一位">›</button>
      </div>
      <label class="switch"><input type="checkbox" id="show-key"><span class="track"></span><span>显示答案</span></label>
      <a class="btn" id="to-review" href="review.html" hidden>线索排查</a>
      <button type="button" class="btn" id="print">打印</button>
    </div>
  </div>
</header>
<main id="view"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
//__SHARED_JS__
const D = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const view = $("view"), input = $("q"), keyBox = $("show-key");
const ids = Object.keys(D.students);
const TITLE = D.assignment || D.archive.replace(/\.zip$/i, "");
const KIND = { single: "单选", multi: "多选", text: "简答" };
const STATUS = { ready: "已出题", stale: "需更新", todo: "待出题", empty: "无代码" };
let filter = "all";

// 题面里的 `代码` 用等宽字体；一律作为文本插入，学生代码里的任何 HTML 都不会被解析
function rich(text) {
  return String(text ?? "").split(/`([^`\n]+)`/).map((part, i) => i % 2 ? el("code", {}, part) : part);
}
function status(id) {
  const s = D.students[id], p = D.papers[id];
  return !s.files.length ? "empty" : !p ? "todo" : p.stale ? "stale" : "ready";
}
function expand(ref) {                        // "main.c:7-9" → main.c:7, main.c:8, main.c:9
  const i = ref.lastIndexOf(":"), file = ref.slice(0, i), [a, b] = ref.slice(i + 1).split("-").map(Number);
  return Array.from({ length: (b || a) - a + 1 }, (_, k) => `${file}:${a + k}`);
}
function rows(refs) {
  return refs.flatMap(expand).map(r => document.querySelector(`.cb-row[data-ref="${CSS.escape(r)}"]`)).filter(Boolean);
}
function pulse(nodes, cls) { nodes.forEach(n => { n.classList.add(cls); setTimeout(() => n.classList.remove(cls), 1100); }); }
function jumpToCode(ref) {
  const hit = rows([ref]);
  if (!hit.length) return;
  hit[0].scrollIntoView({ block: "center", behavior: "smooth" });
  pulse(hit, "focus");
}
function jumpToQuestion(n) {
  const q = $("q" + n);
  if (!q) return;
  q.scrollIntoView({ block: "start", behavior: "smooth" });
  pulse([q], "flash");
}

/* —— 名单 —— */
function showRoster(text = "") {
  document.title = `${TITLE} · 抽查题`;
  $("tools").hidden = true;
  const count = st => ids.filter(id => status(id) === st).length;
  const f = text.trim().toLowerCase();
  const shown = ids.filter(id => (filter === "all" || status(id) === filter)
    && (!f || id.includes(f) || (D.students[id].name || "").toLowerCase().includes(f)));
  const stats = [["ready", "已出题"], ["stale", "需更新"], ["todo", "待出题"], ["empty", "无代码"]].filter(([k]) => count(k) || k === "ready" || k === "todo");
  const chip = (key, label, n) => el("button", { class: "chip", type: "button", "aria-pressed": String(filter === key), onclick: () => { filter = key; showRoster(input.value); } }, label, el("b", {}, String(n)));
  put(view, el("section", { class: "roster" },
    el("div", { class: "roster-head" },
      el("div", {}, el("p", { class: "eyebrow" }, `课堂抽查 · ${D.archive}`), el("h1", {}, TITLE)),
      el("dl", { class: "tally" }, el("div", {}, el("dt", {}, "学生"), el("dd", {}, String(ids.length))),
        stats.map(([k, label]) => el("div", {}, el("dt", {}, el("span", { class: `dot ${k}` }), label), el("dd", {}, String(count(k))))))),
    el("div", { class: "progress", role: "img", "aria-label": "出题进度" }, ["ready", "stale", "empty"].map(k => el("i", { class: "p-" + k, style: `width:${count(k) / ids.length * 100}%` }))),
    el("div", { class: "chips" }, chip("all", "全部", ids.length), stats.map(([k, label]) => chip(k, label, count(k)))),
    shown.length
      ? el("div", { class: "class-grid" }, shown.map(id => {
          const st = status(id), s = D.students[id];
          return el("button", { class: "stu", type: "button", "data-status": st, onclick: () => open(id) },
            el("span", { class: "sid" }, id), el("span", { class: "nm", title: s.name || "" }, parseName(s.name).short),
            el("span", { class: "st" }, el("span", { class: `dot ${st}` }), STATUS[st]));
        }))
      : el("p", { class: "none" }, `名单里没有「${text.trim()}」。检查学号是否输错，或换成姓名试试。`)));
}

/* —— 答卷 —— */
function paperHead(id, s, n) {
  return el("header", { class: "paper-head" },
    el("p", { class: "eyebrow" }, n ? `课堂抽查 · 共 ${n} 题` : "课堂抽查"),
    el("h1", {}, TITLE),
    el("div", { class: "fields" },
      el("div", { class: "field" }, el("span", {}, "学号"), el("span", { class: "boxes", "aria-label": id }, [...id].map(d => el("i", {}, d)))),
      el("div", { class: "field" }, el("span", {}, "姓名"), el("span", { class: "name-line" }, parseName(s.name).short || " "),
        (n => n.en || n.dept ? el("span", { class: "name-sub" }, [n.zh && n.en, n.dept].filter(Boolean).join(" · ")) : null)(parseName(s.name))),
      el("div", { class: "field" }, el("span", {}, "得分"), el("span", { class: "score-box" }))));
}
function sayThis(text) {
  const code = el("span", {}, text);
  return el("span", { class: "say" }, code, el("button", { type: "button", onclick: e => copyText(text, e.currentTarget) }, "复制"));
}
function question(q, n) {
  const choice = q.type !== "text";
  const correct = new Set(choice ? q.answer.split(",") : []);
  const longest = choice ? Math.max(...q.choices.map(c => [...c].length)) : 0;
  const li = el("li", { class: "q", id: "q" + n },
    el("span", { class: "qn" }, String(n)),
    el("div", { class: "qbody" },
      el("p", { class: "stem" }, el("span", { class: "kind" }, KIND[q.type] || q.type), rich(q.question),
        choice ? el("span", { class: "slot" }, "（", el("span", { class: "fill" }, el("span", { class: "key" }, q.answer.replaceAll(",", ""))), "）") : null),
      choice
        ? el("ol", { class: "opts" + (longest <= 7 ? " cols-4" : longest <= 16 ? " cols-2" : "") },
            q.choices.map((c, i) => {
              const letter = String.fromCharCode(65 + i);
              return el("li", { class: correct.has(letter) ? "correct" : null }, el("span", { class: "letter" }, letter), el("span", {}, rich(c)));
            }))
        : el("div", { class: "write", "aria-hidden": "true" }),
      q.lines?.length ? el("div", { class: "refs" }, q.lines.map(r =>
        el("button", { type: "button", class: "ref", title: "在代码里定位", onclick: () => jumpToCode(r) }, r))) : null,
      choice && !q.explain ? null : el("p", { class: "answer key", "data-label": choice ? "解析" : "要点" },
        rich(choice ? q.explain : q.answer), choice || !q.explain ? null : ["；", rich(q.explain)])));
  li.addEventListener("mouseenter", () => rows(q.lines || []).forEach(r => r.classList.add("focus")));
  li.addEventListener("mouseleave", () => rows(q.lines || []).forEach(r => r.classList.remove("focus")));
  return li;
}
function codeColumn(s, p) {
  const marks = {}, hits = {};
  (p ? p.questions : []).forEach((q, i) => (q.lines || []).flatMap(expand).forEach(r => {
    const at = r.lastIndexOf(":"), file = r.slice(0, at), n = Number(r.slice(at + 1));
    (hits[file] ||= new Set()).add(n);
    const list = (marks[file] ||= {})[n] ||= [];
    if (!list.some(m => m.text === String(i + 1))) list.push({ text: String(i + 1), title: `第 ${i + 1} 题`, onclick: () => jumpToQuestion(i + 1) });
  }));
  return el("aside", { class: "code-col", "aria-label": "学生代码" },
    el("div", { class: "code-head" },
      el("h2", {}, "学生代码"),
      el("p", {}, [`${s.files.length} 个文件`, s.submitted && `提交于 ${s.submitted}`].filter(Boolean).join(" · ")),
      s.notes.length ? el("details", { class: "notes" }, el("summary", {}, `导入说明（${s.notes.length} 条）`), el("ul", {}, s.notes.map(n => el("li", {}, n)))) : null),
    s.files.map(f => codeBlock({ name: f.name, code: f.code, hits: hits[f.name] || new Set(), marks: marks[f.name] || {} })));
}
function showStudent(id) {
  const s = D.students[id], p = D.papers[id], st = status(id), at = ids.indexOf(id);
  document.title = `${id} ${parseName(s.name).short} · 抽查题`.replace("  ", " ");
  $("tools").hidden = false;
  $("pos").textContent = `${at + 1} / ${ids.length}`;
  $("prev").disabled = at === 0;
  $("next").disabled = at === ids.length - 1;
  keyBox.disabled = !p;
  $("to-review").hidden = !D.has_review;
  $("to-review").href = "review.html#" + id;
  const sheet = el("article", { class: "paper" }, paperHead(id, s, p && p.questions.length));
  if (st === "empty") {
    sheet.append(el("div", { class: "notice" }, el("b", {}, "这份提交里没有可读的代码或文字"),
      "附件可能只有截图、可执行文件、压缩包（.7z / .rar）或 PDF。请到 Blackboard 核对原始提交。"));
  } else if (!p) {
    sheet.append(el("div", { class: "notice calm" }, el("b", {}, "还没给这位同学出题"),
      "在对话里对 Claude 说下面这句，出完后刷新本页：", el("br"), sayThis(`给 ${id} 出题`)));
  } else {
    if (p.stale) sheet.append(el("div", { class: "notice" }, el("b", {}, "代码在出题后改过，题目可能对不上"),
      "建议重新出题。在对话里说：", el("br"), sayThis(`重新给 ${id} 出题`)));
    if (p.summary) sheet.append(el("p", { class: "ta-note key", "data-label": "TA 备注" }, rich(p.summary)));
    sheet.append(el("ol", { class: "qs" }, p.questions.map((q, i) => question(q, i + 1))));
  }
  put(view, el("div", { class: "desk" + (s.files.length ? " two" : "") }, sheet, s.files.length ? codeColumn(s, p) : null));
  scrollTo(0, 0);
}

/* —— 路由与键盘 —— */
function open(id) { location.hash = encodeURIComponent(id); }
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (D.students[id]) { input.value = id; showStudent(id); }
  else showRoster(input.value === id ? "" : input.value);
}
function matches(text) {
  const f = text.trim().toLowerCase();
  if (D.students[f]) return [f];
  return ids.filter(id => id.endsWith(f) || id.includes(f) || (D.students[id].name || "").toLowerCase().includes(f));
}
$("find").addEventListener("submit", e => {
  e.preventDefault();
  const hits = matches(input.value);
  if (input.value.trim() && hits.length === 1) open(hits[0]);
});
input.addEventListener("input", () => {
  if (location.hash.length > 1) location.hash = "";
  else showRoster(input.value);
});
$("home").addEventListener("click", () => { input.value = ""; filter = "all"; showRoster(); });
$("prev").addEventListener("click", () => open(ids[ids.indexOf(decodeURIComponent(location.hash.slice(1))) - 1]));
$("next").addEventListener("click", () => open(ids[ids.indexOf(decodeURIComponent(location.hash.slice(1))) + 1]));
$("print").addEventListener("click", () => print());
try { keyBox.checked = localStorage.getItem("ta-quiz-show-key") === "1"; } catch {}
document.body.classList.toggle("show-key", keyBox.checked);
keyBox.addEventListener("change", () => {
  document.body.classList.toggle("show-key", keyBox.checked);
  try { localStorage.setItem("ta-quiz-show-key", keyBox.checked ? "1" : "0"); } catch {}
});
addEventListener("keydown", e => {
  if (e.target === input) { if (e.key === "Escape") input.blur(); return; }
  const onStudent = !$("tools").hidden;
  if (e.key === "/") { e.preventDefault(); input.focus(); input.select(); }
  else if (onStudent && e.key === "ArrowLeft" && !$("prev").disabled) $("prev").click();
  else if (onStudent && e.key === "ArrowRight" && !$("next").disabled) $("next").click();
  else if (onStudent && e.key === "Escape") { input.value = ""; location.hash = ""; }
});
new ResizeObserver(() => document.documentElement.style.setProperty("--bar-h", $("bar").offsetHeight + "px")).observe($("bar"));
$("bar-title").textContent = TITLE;
addEventListener("hashchange", route);
route();
</script>
</body>
