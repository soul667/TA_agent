[project]
name = "adaptive-assessment"
version = "0.1.0"
description = "基于学生原始作业生成个性化诊断问卷的教学系统 MVP"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "qrcode>=8.2",
]

[project.optional-dependencies]
llm = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "openai>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "cassette: 盒带回归（真实 LLM 原始响应离线重放；需先运行 python -m app.eval_harness 录制）",
]
